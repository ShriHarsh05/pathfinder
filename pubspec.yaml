name: pathfinder_indoor_navigation
description: "Indoor navigation app for GDN building using IoT-based positioning."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  searchfield: ^0.8.4
  http: ^1.2.1
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/gdn_ground_floor.png
    - assets/maps/gdn_ground_floor_graph.json
